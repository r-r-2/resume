.pbar b{display:block;height:100%;width:0;background:rgba(154,37,71,.6);border-radius:0 2px 2px 0}
/* data */
#data .dsrc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--ink-2);margin-bottom:16px}
#data .dsrc span{display:inline-flex;align-items:center;gap:6px;background:var(--raise-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#data .dsrc .ic{width:14px;height:14px;color:var(--ink-3)}
#data .dsrc i{flex:1;min-width:18px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,#2F6DB3 0 6px,transparent 6px 12px);background-size:12px 3px;animation:flowx .8s linear infinite;opacity:.7}
#data .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
#data .dp{display:flex;flex-direction:column;position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;min-width:0}
#data .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600;margin-bottom:10px}
#data .tags{display:flex;gap:4px}#data .tags i{font:500 12px var(--mono);font-style:normal;padding:2px 7px;border-radius:8px;background:var(--raise-2);color:var(--ink-2)}
#data .sub{font-size:12px;color:var(--ink-3);margin:6px 0 8px}
#data .mix{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
#data .lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--ink-2)}#data .lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#data .cv{display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:clamp(10px,2.4vh,22px);font:500 12px var(--mono);color:var(--ink-2)}
#data .tr{height:clamp(12px,2.4vh,20px);border-radius:6px;background:var(--raise-2);overflow:hidden}
#data .tr b{display:block;height:100%;border-radius:6px;animation:breathe 5s ease-in-out infinite}
#data .cv+.cv .tr b{animation-delay:-2.5s}
@keyframes breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
#data .tr b{transform-origin:left}
#data .dn{font-size:13px;color:var(--ink-2);margin-top:auto;padding-top:12px}
#data .dn em{font-style:normal;font-family:var(--mono);color:var(--ok);margin-left:4px}
#data .fr{position:relative;height:clamp(20px,3vh,28px);margin-bottom:clamp(4px,.9vh,9px);display:flex;align-items:center}
#data .fr b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#DCE6F3}
#data .fr span{position:relative;font-size:12px;padding-left:8px;white-space:nowrap;color:var(--ink)}
#data .fr.hi b{background:var(--maroon-soft);box-shadow:0 0 0 1.5px var(--maroon)}
@keyframes hig{0%,100%{box-shadow:0 0 0 1.5px var(--maroon)}50%{box-shadow:0 0 0 4px rgba(154,37,71,.25)}}
#dfdot{display:none;position:absolute;left:64px;width:2px;height:2px;top:54px;animation:fdot 8s steps(1,end) infinite}
@keyframes fdot{0%{top:54px}25%{top:85px}50%{top:116px}75%,100%{top:147px}}

#data .bd{fill:rgba(22,148,108,.1)}
#data #dan .ln{fill:none;stroke:#2F6DB3;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#data #dan.bad .ln{stroke:#D83C3B}
#data .dal{position:absolute;right:14px;top:70px;display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:#fff;background:#D83C3B;padding:4px 9px;border-radius:12px;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
#data #dan .dal .ic{width:13px;height:13px;display:inline}
#data #dan.bad .dal{opacity:1;transform:none}

@media (max-width:720px){#data .dgrid{grid-template-columns:1fr;gap:8px}#data .dp{padding:10px 12px}#data .dh{margin-bottom:8px}#data .dsrc{margin-bottom:10px;font-size:12px}#data .dsrc i{min-width:10px}}
/* notes from teammates */
#notes .nts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#notes .nt{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px 16px;}
@keyframes nglow{0%,22%,100%{border-color:var(--line);box-shadow:none}6%,16%{border-color:rgba(154,37,71,.45);box-shadow:0 10px 30px -18px rgba(154,37,71,.45)}}
#notes figcaption{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
#notes .av{width:28px;height:28px;border-radius:50%;background:var(--maroon-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--maroon)}#notes .av .ic{width:15px;height:15px}
#notes blockquote{margin:0;font-size:clamp(13px,min(1vw,1.85vh),16px);line-height:1.55;color:var(--ink)}
#notes .nsm{margin-top:12px;font-size:12px;color:var(--ink-3);text-align:center}
@media (max-width:720px){#notes .nts{grid-template-columns:1fr;gap:8px}#notes .nt{padding:9px 12px}#notes figcaption{margin-bottom:4px}#notes blockquote{font-size:13px;line-height:1.45}}
/* talks at work: small continuous motion in each card */
@keyframes bgrow{0%,8%{transform:scaleY(.35)}30%,100%{transform:scaleY(1)}}
#talks-internal .bars rect{transform-box:fill-box;transform-origin:bottom;animation:bgrow 6s ease-out infinite}
#talks-internal .bars rect:nth-child(2){animation-delay:.12s}#talks-internal .bars rect:nth-child(3){animation-delay:.24s}#talks-internal .bars rect:nth-child(4){animation-delay:.36s}#talks-internal .bars rect:nth-child(5){animation-delay:.48s}
#talks-internal .pkt2{offset-path:path('M46 53H64L98 47L116 59');animation:pk2 4s linear infinite}
@keyframes pk2{0%{offset-distance:0%;opacity:0}10%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes tick{0%,45%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}
#talks-internal .tk3{animation:tick 5s ease-in-out infinite}
body{position:relative}
/* the top bar's own little route */
.idx-in{position:relative}
.idx-in::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dotted #C3C9D3;z-index:0}
.idx-in::after{content:"";position:absolute;left:0;top:50%;width:var(--px,0px);border-top:2px solid var(--maroon);opacity:.55;z-index:0;transition:width .45s}
.idx-in>*{position:relative;z-index:1}
.grp{background:linear-gradient(var(--paper),var(--paper)) padding-box;margin:0 6px;padding:0 6px!important}
.grp:first-child{margin-left:0}
/* handoff to the next stop */
.handoff{position:absolute;left:50%;bottom:clamp(10px,2.4vh,22px);transform:translateX(-50%);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font:500 13px var(--mono);color:var(--maroon);text-decoration:none;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:8px 16px 8px 12px;box-shadow:0 8px 20px -14px rgba(30,36,48,.45);transition:background .2s,color .2s,border-color .2s,gap .2s;z-index:2}
.handoff:hover{gap:11px;color:#fff;background:var(--maroon);border-color:var(--maroon)}
.handoff .ic{width:14px;height:14px}
.stop:has(.handoff){padding-bottom:max(clamp(20px,5vh,64px),64px)}
.eyebrow span{color:var(--text-3);font-weight:500}
/* your request: one chip that travels from scene to scene */
.req{position:fixed;left:0;top:0;z-index:14;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:12px;background:var(--maroon);color:#fff;font:500 12px/1 var(--mono);white-space:nowrap;pointer-events:none;opacity:0;box-shadow:0 6px 16px -8px rgba(154,37,71,.7);transition:background .35s,box-shadow .35s,padding .3s,height .3s,width .3s;will-change:transform,opacity}
.req i{width:7px;height:7px;border-radius:50%;background:#fff;flex-shrink:0}
.req.rev{flex-direction:row-reverse;padding:0 8px 0 10px}
.req[data-tone="bad"]{background:#D83C3B;box-shadow:0 6px 16px -8px rgba(216,60,59,.8)}
.req[data-tone="warn"]{background:#C9790F;box-shadow:0 6px 16px -8px rgba(201,121,15,.8)}
.req[data-tone="ok"]{background:#16946C;box-shadow:0 6px 16px -8px rgba(22,148,108,.8)}
.req.dot{padding:0;width:16px;height:16px;justify-content:center;border:3px solid #fff}
.req.dot span{display:none}.req.dot i{display:none}
#spk{fill:var(--maroon)}
/* finale calls to action */
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.cta a{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.cta .ic{width:16px;height:16px}
.cta .book{background:var(--maroon);color:#fff;border:1px solid var(--maroon)}
.cta .book:hover{background:var(--maroon-hi);color:#fff}
.cta .blogbtn{background:#fff;color:var(--text);border:1px solid var(--rule)}
.cta .blogbtn:hover{border-color:var(--maroon);color:var(--maroon)}
/* chat scrolls inside its box, like a real channel */
#ochat{max-height:min(58vh,600px);overflow-y:auto;scroll-behavior:smooth;scrollbar-width:thin;padding-right:4px}
@media (min-width:960px){#oncall .m{padding:4px 2px}}

/* ---------- 1 start ---------- */
#start h1{font-family:var(--display);font-size:clamp(48px,min(6.2vw,12vh),112px);font-weight:700;font-variation-settings:'opsz' 96;letter-spacing:-.035em;line-height:.9;margin:0;color:var(--text)}
#start .tg{font-size:clamp(19px,1.7vw,24px);line-height:1.4;color:var(--text);margin:26px 0 0;max-width:24ch;text-wrap:balance}
